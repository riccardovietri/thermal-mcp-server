[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-mcp-server"
version = "0.3.0"
description = "MCP server for datacenter GPU liquid cooling thermal analysis"
authors = [{name = "Riccardo Vietri"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "thermal", "cooling", "gpu", "datacenter", "liquid-cooling", "nvidia", "h100", "b200"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # >=2.10: examples/mcp_client_demo.py uses CallToolResult.data (added in 2.10.0).
    "fastmcp>=2.10.0,<3",
    "pydantic>=2.6.0",
]

# Dev tooling is declared here (PEP 621 extra, for `pip install -e ".[dev]"`)
# and mirrored under [dependency-groups] (PEP 735, for `uv sync --group dev`).
# Keep the two lists identical.
[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "nbmake>=1.5.0",
    "pytest>=9.0.2",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]
demo = [
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/riccardovietri/thermal-mcp-server"
Source = "https://github.com/riccardovietri/thermal-mcp-server"
"Bug Tracker" = "https://github.com/riccardovietri/thermal-mcp-server/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["_attic", "examples/interactive_sizing.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

# Typing baseline: the package type-checks clean. Scoped to src/ — examples
# and the _attic/ scratch code are intentionally excluded from the gate.
[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
# fastmcp does not ship type stubs; don't fail on its missing imports.
[[tool.mypy.overrides]]
module = ["fastmcp.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "nbmake>=1.5.0",
    "pytest>=9.0.2",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]
