name: Claude Review Response

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    # Fire when the Claude review agent posts its findings summary on a PR.
    # claude-code-action uses issues.createComment (not a formal review object), so we
    # listen on issue_comment, not pull_request_review.
    #
    # We use a unique marker <!-- claude-review-findings --> rather than [BLOCKING] to
    # avoid self-triggering: the fix agent's own summary comment could otherwise contain
    # [BLOCKING] and loop indefinitely.
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      contains(github.event.comment.body, '<!-- claude-review-findings -->')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write

    steps:
      # issue_comment context runs against the default branch, not the PR branch.
      # Explicitly check out the PR head so the fix agent edits the right code.
      - name: Get PR head ref
        id: pr
        run: |
          head_ref=$(gh pr view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --json headRefName -q .headRefName)
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Respond to review findings
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The Claude code review just posted its findings summary on this PR. Your role is the fix agent.

            Summary comment:
            ${{ github.event.comment.body }}

            Read CLAUDE.md and docs/review-policy.md for project context and severity rules.

            Then gather the full review context:
            1. Read the full diff of this PR.
            2. Fetch all inline review comments on this PR using:
               gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/comments
               These contain the per-line [BLOCKING] and [SUGGESTION] findings — do not skip this step.

            For each [BLOCKING] finding (from both the summary and inline comments):
            1. Assess whether it is a real issue (cross-reference CLAUDE.md, docs/physics.md).
            2. If real: fix it directly in the code, run `uv run pytest -v`, commit with
               an appropriate prefix (fix:, docs:, test:). Do not return until tests pass.
            3. If not applicable: post a reply comment citing the specific rule or
               doc section that explains why.

            For each [SUGGESTION] finding: no action required unless obviously correct
            and trivially safe. Do not apply suggestions that touch physics, defaults,
            or tests without explicit author approval.

            After handling all findings, post a single summary comment on the PR with:
            - Each [BLOCKING] finding: "fixed" (commit ref) or "disputed" (reason)
            - Each [SUGGESTION]: "applied" or "deferred"
            - Tests run and pass/fail status
            - Whether any findings remain unresolved (require human decision)

            Do NOT include the text "<!-- claude-review-findings -->" anywhere in your comment.
