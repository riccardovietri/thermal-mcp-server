name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request. Read CLAUDE.md and docs/review-policy.md first for project context and review standards.

            Check for:
            1. Physics correctness — units consistent (K for resistance, °C for I/O),
               dimensional analysis, energy balance closes within 1%
            2. Test coverage — any physics or schema change must have a hand-calc
               validation test in tests/test_physics_behavior.py
            3. Tolerance integrity — numerical tolerances must not be relaxed (<1°C on Tj, <5 on Re)
            4. MCP layer discipline — no physics logic in mcp_server.py
            5. Known limitations — model limitations must be documented, not papered over
            6. Docs — docs/physics.md updated if physics changed
            7. API compatibility — no schema renames or removals without a migration path
            8. Regressions — spot-check that existing behavior is preserved

            Label every finding with its severity:
            - [BLOCKING] — correctness bug, regression, broken test, or release risk. Must be fixed or explicitly waived before merge.
            - [SUGGESTION] — style, minor improvement, or optional enhancement. No action required.

            Post findings as inline comments on the relevant lines.
            End with a top-level comment that begins with the exact text:
            <!-- claude-review-findings -->

            Then lists:
            - All [BLOCKING] findings (or "No blocking findings.")
            - All [SUGGESTION] findings (or "No suggestions.")
            - Whether the PR is ready to merge pending triage.

            The marker <!-- claude-review-findings --> is required — it is used to trigger
            the automated fix agent. Do not omit it.

