name: Daily Physics Regression

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:       # allow manual runs

jobs:
  physics-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --group dev

      - name: Run hand-calc validation tests
        run: uv run pytest tests/test_physics_behavior.py -v --tb=short

      - name: Run benchmark examples
        run: |
          echo "=== NVL72 Rack Analysis ==="
          uv run python examples/nvl72_rack_analysis.py
          echo ""
          echo "=== Topology Tradeoffs ==="
          uv run python examples/rack_topology_tradeoffs.py
          echo ""
          echo "=== AI Factory Cooling Budget ==="
          uv run python examples/ai_factory_cooling_budget.py

      - name: Post failure comment to main branch issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner,
              repo,
              title: `[Daily Regression] Physics tests failed ${new Date().toISOString().split('T')[0]}`,
              body: `The daily physics regression canary failed.\n\nRun: ${runUrl}\n\nCheck for breaking changes in pydantic, fastmcp, or physics constants.`,
              labels: ['regression', 'physics'],
            });
