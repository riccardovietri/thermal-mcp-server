name: Daily Physics Regression

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:       # allow manual runs

jobs:
  physics-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --group dev

      - name: Run hand-calc validation tests
        run: uv run pytest tests/test_physics_behavior.py -v --tb=short

      - name: Run benchmark examples
        run: |
          # Run any extended examples that exist in the repo.
          # Guards prevent failures when example files haven't been merged yet.
          for script in \
            examples/nvl72_rack_analysis.py \
            examples/rack_topology_tradeoffs.py \
            examples/real_chip_benchmarks.py \
            examples/quickstart.py \
            examples/rack_sizing_example.py; do
            if [ -f "$script" ]; then
              echo "=== $script ==="
              uv run python "$script"
              echo ""
            else
              echo "=== $script (skipped — not present in this commit) ==="
            fi
          done

      - name: Post failure comment to main branch issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner,
              repo,
              title: `[Daily Regression] Physics tests failed ${new Date().toISOString().split('T')[0]}`,
              body: `The daily physics regression canary failed.\n\nRun: ${runUrl}\n\nCheck for breaking changes in pydantic, fastmcp, or physics constants.`,
              labels: ['regression', 'physics'],
            });
